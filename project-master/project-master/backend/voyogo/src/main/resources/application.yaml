spring:
  application:
    name: voyogo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voyago}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

    show-sql: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable:true


jwt:
  secret: ${JWT_SECRET:Q2hhbmdlVGhpc0pXVFNlY3JldEluRW52VmFyQW5kVXNlMjU2Qml0S2V5IQ==}
  expiry_time: ${JWT_EXPIRY_TIME:36000000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}


